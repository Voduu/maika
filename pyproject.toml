[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maika"
version = "0.1.0"
description = "Maika, a personal Discord bot for a small friend server."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord.py==2.7.1",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings (includes W505, doc line length)
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # bugbear
]

[tool.ruff.lint.pycodestyle]
# PEP 8 limits comments and docstrings to 72 characters.
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests are exempt from the docstring rules.
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
# discord.utils.escape_markdown passes count to re.sub positionally,
# which Python 3.14 deprecates. Only that warning from that module is
# ignored, so every other warning still shows (design section 8).
filterwarnings = [
    "ignore:'count' is passed as positional argument:DeprecationWarning:discord.utils",
]
